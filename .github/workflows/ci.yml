name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source
        run: python -m compileall -q chesslife_demo tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify installed package
        run: |
          python -m pip install .
          cd /tmp
          chesslife-demo --db /tmp/chesslife-ci.sqlite3 init-db

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -t chesslife-demo:test .
