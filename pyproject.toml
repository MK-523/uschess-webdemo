[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chesslife-discovery-demo"
version = "1.0.0"
description = "SQLite-backed public ChessLife publication discovery demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
chesslife-demo = "chesslife_demo.__main__:main"

[tool.setuptools.packages.find]
include = ["chesslife_demo*"]

[tool.setuptools.package-data]
chesslife_demo = ["migrations/*.sql", "static/*.html", "static/*.css", "static/*.js"]
